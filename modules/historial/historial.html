<section class="historial historial-pro">
  <header class="hisHero">
    <div class="hisHero__copy">
      <span class="hisHero__eyebrow">Registro de movimientos</span>
      <h1>Historial</h1>
      <p>Consulta ventas, servicios y membresías, revisa tickets y reimprime comprobantes desde una vista más clara.</p>
    </div>
  </header>

  <section class="hisFilters">
    <div class="field field--search">
      <label>Buscar</label>
      <input id="h-search" class="input" placeholder="Ticket / cliente / producto / concepto">
    </div>
    <div class="field">
      <label>Desde</label>
      <input id="h-from" class="input" type="date">
    </div>
    <div class="field">
      <label>Hasta</label>
      <input id="h-to" class="input" type="date">
    </div>
    <button class="btn btn--ghost" type="button" id="h-clear">Limpiar</button>
  </section>

  <section class="his__stats" id="h-stats"></section>

  <div class="his__grid">
    <main class="hisPane hisPane--list">
      <div class="card__head">
        <div>
          <h2 class="h2">Listado</h2>
          <div class="muted small">Busca por ticket, cliente o producto.</div>
        </div>
      </div>

      <div id="h-list" class="hisList"></div>
      <div class="muted hisEmpty" id="h-empty" style="display:none;">Sin resultados.</div>
    </main>

    <aside class="hisPane hisPane--ticket">
      <div class="card__head">
        <div>
          <h2 class="h2">Ticket</h2>
          <div class="muted small">Previsualización del comprobante.</div>
        </div>
      </div>

      <div class="ticketBox">
        <div class="ticketHead">
          <strong id="h-ticketTitle">Ticket</strong>
          <button class="btn btn--ghost" type="button" id="h-print" disabled>Imprimir</button>
        </div>
        <div id="h-ticketPreview" class="ticketPreview muted">Selecciona una venta para ver el ticket.</div>
      </div>
    </aside>
  </div>
</section>
