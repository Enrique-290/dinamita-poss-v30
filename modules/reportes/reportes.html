<section class="reportes reportes-pro">
  <header class="repHero">
    <div class="repHero__copy">
      <span class="repHero__eyebrow">Análisis del negocio</span>
      <h1>Reportes</h1>
      <p>Consulta ventas, productos, membresías, categorías y cortes con filtros claros y exportaciones rápidas.</p>
    </div>
    <div class="repHero__actions">
      <button class="btn btn--ghost" type="button" id="r-exportCsv">Exportar Excel</button>
      <button class="btn" type="button" id="r-exportPdf">Exportar PDF</button>
    </div>
  </header>

  <section class="repControls">
    <div class="field">
      <label>Tipo de reporte</label>
      <select id="r-type" class="input">
        <option value="general">General</option>
        <option value="operativo">Operativo</option>
        <option value="productos">Por producto</option>
        <option value="categoria">Por categoría</option>
        <option value="membresias">Membresías</option>
        <option value="cortes">Cortes de caja</option>
      </select>
    </div>
    <div class="field">
      <label>Desde</label>
      <input id="r-from" class="input" type="date">
    </div>
    <div class="field">
      <label>Hasta</label>
      <input id="r-to" class="input" type="date">
    </div>
    <div class="field repCategoryField">
      <label>Categoría</label>
      <select id="r-category" class="input" style="display:none;"></select>
    </div>
    <div class="repControlBtns">
      <button class="btn" type="button" id="r-apply">Aplicar</button>
      <button class="btn btn--ghost" type="button" id="r-reset">Restablecer</button>
    </div>
  </section>

  <section class="rep__stats" id="r-stats"></section>

  <div class="rep__grid">
    <main class="repPane repPane--table">
      <div class="card__head">
        <div>
          <h2 class="h2" id="r-title">Detalle</h2>
          <div class="muted small" id="r-subtitle"></div>
        </div>
      </div>
      <div class="repTableWrap">
        <table class="repTable" id="r-table">
          <thead id="r-thead"></thead>
          <tbody id="r-tbody"></tbody>
        </table>
      </div>
      <div class="muted repEmpty" id="r-empty" style="display:none;">Sin datos.</div>
    </main>

    <aside class="repPane repPane--side">
      <div class="card__head">
        <div>
          <h2 class="h2">Vista rápida</h2>
          <div class="muted small">Totales y contexto del reporte</div>
        </div>
      </div>
      <div id="r-side" class="repSide"></div>
    </aside>
  </div>
</section>
